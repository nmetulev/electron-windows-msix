name: Consumer Smoke Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consumer-smoke:
    name: Install from public npm and package
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'yarn'

      # Build lib/ so `npm pack` ships the compiled output. npm pack does not run the
      # (deprecated) prepublish build hook, so the library must be built explicitly.
      - name: Install dependencies and build library
        run: |
          yarn install --immutable
          yarn build

      - name: Pack the module
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $packOutput = npm pack --ignore-scripts --silent
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed with exit $LASTEXITCODE" }
          $tarball = ($packOutput | Where-Object { $_ -match '\.tgz$' } | Select-Object -Last 1).Trim()
          if (-not $tarball -or -not (Test-Path $tarball)) { throw "npm pack did not produce a tarball (got '$tarball')" }
          Write-Host "Packed $tarball"
          "tarball=$tarball" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Install the packed tarball in a scratch project OUTSIDE the repo so there is no
      # inherited .yarnrc.yml/.npmrc, and force the default public registry. This proves
      # the real consumer path: @microsoft/winappcli resolves from public npm as an
      # optionalDependency rather than from this repo's internal lockfile feed.
      - name: Install packed module from the public npm registry
        id: consumer
        shell: pwsh
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          npm_config_registry: https://registry.npmjs.org/
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $consumer = Join-Path $env:RUNNER_TEMP 'consumer'
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null

          $tarballName = Split-Path $env:TARBALL -Leaf
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE $env:TARBALL) (Join-Path $consumer $tarballName)
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'test\consumer\consumer-smoke.mjs') (Join-Path $consumer 'consumer-smoke.mjs')

          Set-Location $consumer
          npm init -y | Out-Null

          Write-Host "Installing $tarballName from $env:npm_config_registry"
          npm install --no-audit --no-fund (Join-Path $consumer $tarballName)
          if ($LASTEXITCODE -ne 0) { throw "npm install failed with exit $LASTEXITCODE" }

          Write-Host '=== @microsoft/winappcli dependency tree ==='
          npm ls @microsoft/winappcli

          # Fail fast if the optional dependency did not resolve from public npm.
          node -e "console.log('winappcli:', require.resolve('@microsoft/winappcli'))"
          if ($LASTEXITCODE -ne 0) { throw '@microsoft/winappcli did not install from the public npm registry' }

          "dir=$consumer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Run packaging as a plain node script (not vitest) to avoid a test timeout during
      # winappcli's first-run SDK acquisition on a cold NuGet cache.
      - name: Package the fixture app through the installed module
        shell: pwsh
        env:
          CONSUMER_DIR: ${{ steps.consumer.outputs.dir }}
          FIXTURES: ${{ github.workspace }}\test\e2e\fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:OUT_DIR = Join-Path $env:CONSUMER_DIR 'out'
          Set-Location $env:CONSUMER_DIR
          node consumer-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw "Packaging script failed with exit $LASTEXITCODE" }

      - name: Trust the developer certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'test\e2e\scripts\install_test_cert.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Certificate trust script failed with exit $LASTEXITCODE" }

      - name: Install, launch, and uninstall the packaged app
        shell: pwsh
        env:
          CONSUMER_DIR: ${{ steps.consumer.outputs.dir }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $msix = Join-Path $env:CONSUMER_DIR 'out\hellomsix_x64.msix'
          if (-not (Test-Path $msix)) { throw "MSIX not found at $msix" }

          Write-Host "Installing $msix"
          Add-AppxPackage -Path $msix

          $pkg = Get-AppxPackage -Name 'Electron.MySuite.HelloMSIX'
          if (-not $pkg) { throw 'Package was not registered after install' }
          Write-Host "Installed $($pkg.Name) $($pkg.Version)"
          if ($pkg.Version -ne '1.2.3.4') { throw "Unexpected version $($pkg.Version)" }

          Write-Host 'Launching the app'
          explorer.exe 'shell:appsFolder\Electron.MySuite.HelloMSIX_98sq593n0v5ec!HelloMSIX'
          Start-Sleep -Seconds 5
          $procs = @(Get-Process -Name 'hellomsix' -ErrorAction SilentlyContinue)
          if ($procs.Count -lt 1) { throw 'App process did not start' }
          Write-Host "App is running ($($procs.Count) process(es))"
          $procs | Stop-Process -Force

          Write-Host 'Uninstalling'
          Get-AppxPackage -Name 'Electron.MySuite.HelloMSIX' | Remove-AppxPackage
          if (Get-AppxPackage -Name 'Electron.MySuite.HelloMSIX') { throw 'Package still present after uninstall' }
          Write-Host 'Consumer smoke test PASSED'
