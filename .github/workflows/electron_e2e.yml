name: Electron E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  electron-e2e:
    name: Package and run a real Electron app
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'yarn'

      # Build lib/ so `npm pack` ships the compiled output (npm pack does not run the
      # deprecated prepublish build hook).
      - name: Install dependencies and build library
        run: |
          yarn install --immutable
          yarn build

      - name: Pack the module
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $packOutput = npm pack --ignore-scripts --silent
          if ($LASTEXITCODE -ne 0) { throw "npm pack failed with exit $LASTEXITCODE" }
          $tarball = ($packOutput | Where-Object { $_ -match '\.tgz$' } | Select-Object -Last 1).Trim()
          if (-not $tarball -or -not (Test-Path $tarball)) { throw "npm pack did not produce a tarball (got '$tarball')" }
          Write-Host "Packed $tarball"
          "tarball=$tarball" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Build a genuine Electron app with @electron/packager (downloads Electron from the
      # public registry / GitHub, exactly like a real developer). Produces an unpacked
      # win32-x64 app folder whose HelloElectron.exe becomes the MSIX entry point.
      - name: Build the Electron app
        id: appbuild
        shell: pwsh
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'test\e2e\fixtures\electron-app')
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install (electron app) failed with exit $LASTEXITCODE" }

          $appOut = Join-Path $env:RUNNER_TEMP 'electron-out'
          npx --no-install electron-packager . HelloElectron --platform=win32 --arch=x64 --out=$appOut --overwrite
          if ($LASTEXITCODE -ne 0) { throw "electron-packager failed with exit $LASTEXITCODE" }

          $appDir = Join-Path $appOut 'HelloElectron-win32-x64'
          $exe = Join-Path $appDir 'HelloElectron.exe'
          if (-not (Test-Path $exe)) { throw "electron-packager did not produce $exe" }
          Write-Host "Built Electron app at $appDir"
          "appdir=$appDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Install the packed tarball in a scratch project OUTSIDE the repo against the public
      # registry, so @microsoft/winappcli resolves as an optionalDependency from public npm.
      - name: Install packed module from the public npm registry
        id: consumer
        shell: pwsh
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          npm_config_registry: https://registry.npmjs.org/
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $consumer = Join-Path $env:RUNNER_TEMP 'consumer'
          New-Item -ItemType Directory -Force -Path $consumer | Out-Null

          $tarballName = Split-Path $env:TARBALL -Leaf
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE $env:TARBALL) (Join-Path $consumer $tarballName)
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'test\consumer\consumer-smoke.mjs') (Join-Path $consumer 'consumer-smoke.mjs')

          Set-Location $consumer
          npm init -y | Out-Null

          Write-Host "Installing $tarballName from $env:npm_config_registry"
          npm install --no-audit --no-fund (Join-Path $consumer $tarballName)
          if ($LASTEXITCODE -ne 0) { throw "npm install failed with exit $LASTEXITCODE" }

          Write-Host '=== @microsoft/winappcli dependency tree ==='
          npm ls @microsoft/winappcli

          node -e "console.log('winappcli:', require.resolve('@microsoft/winappcli'))"
          if ($LASTEXITCODE -ne 0) { throw '@microsoft/winappcli did not install from the public npm registry' }

          "dir=$consumer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Package the real Electron app through the installed module. Runs as a plain node
      # script to avoid a test timeout during winappcli's cold SDK acquisition.
      - name: Package the Electron app into an MSIX
        id: pkg
        shell: pwsh
        env:
          CONSUMER_DIR: ${{ steps.consumer.outputs.dir }}
          FIXTURES: ${{ github.workspace }}\test\e2e\fixtures
          APP_DIR: ${{ steps.appbuild.outputs.appdir }}
          APP_MANIFEST: ${{ github.workspace }}\test\e2e\fixtures\AppxManifest_electron.xml
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:OUT_DIR = Join-Path $env:CONSUMER_DIR 'out'
          Set-Location $env:CONSUMER_DIR
          node consumer-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw "Packaging script failed with exit $LASTEXITCODE" }

      - name: Trust the developer certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          pwsh -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'test\e2e\scripts\install_test_cert.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Certificate trust script failed with exit $LASTEXITCODE" }

      - name: Install, launch, and uninstall the Electron MSIX
        shell: pwsh
        env:
          MSIX: ${{ steps.pkg.outputs.msix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          if (-not (Test-Path $env:MSIX)) { throw "MSIX not found at $env:MSIX" }

          Write-Host "Installing $env:MSIX"
          Add-AppxPackage -Path $env:MSIX

          $pkg = Get-AppxPackage -Name 'Electron.MySuite.HelloElectron'
          if (-not $pkg) { throw 'Package was not registered after install' }
          Write-Host "Installed $($pkg.Name) $($pkg.Version)"
          if ($pkg.Version -ne '1.2.3.4') { throw "Unexpected version $($pkg.Version)" }

          $pfn = $pkg.PackageFamilyName
          Write-Host "Launching shell:appsFolder\$pfn!HelloElectron"
          explorer.exe "shell:appsFolder\$pfn!HelloElectron"

          # Electron cold start + first-run MSIX registration can take a while; poll.
          $deadline = (Get-Date).AddSeconds(60)
          $procs = @()
          do {
            Start-Sleep -Seconds 3
            $procs = @(Get-Process -Name 'HelloElectron' -ErrorAction SilentlyContinue)
          } while ($procs.Count -lt 1 -and (Get-Date) -lt $deadline)

          if ($procs.Count -lt 1) { throw 'HelloElectron process did not start' }
          Write-Host "HelloElectron is running ($($procs.Count) process(es))"

          # Best-effort proof that our main.js actually executed (marker is redirected into
          # the package's LocalCache for an MSIX app). Non-fatal: the process check is the gate.
          $markerCandidates = @(
            (Join-Path $env:LOCALAPPDATA "Packages\$pfn\LocalCache\Local\Temp\electron-msix-smoke.marker"),
            (Join-Path $env:TEMP 'electron-msix-smoke.marker')
          )
          $marker = $markerCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($marker) {
            Write-Host "Startup marker found at $marker:"
            Get-Content $marker | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host '::warning::Startup marker not found (non-fatal; process check passed)'
          }

          Get-Process -Name 'HelloElectron' -ErrorAction SilentlyContinue | Stop-Process -Force

          Write-Host 'Uninstalling'
          Get-AppxPackage -Name 'Electron.MySuite.HelloElectron' | Remove-AppxPackage
          if (Get-AppxPackage -Name 'Electron.MySuite.HelloElectron') { throw 'Package still present after uninstall' }
          Write-Host 'Electron E2E PASSED'
